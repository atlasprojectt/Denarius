# Auto-deploy to Vercel production on every push to main.
#
# Why a workflow instead of Vercel's native Git integration: the repo is a
# private org-owned repo, which Vercel's Hobby (free) plan can't connect. This
# CLI-token flow achieves the same push-to-deploy on the free tier, repo private.
#
# Quality gate first: lint + typecheck + unit tests must pass before deploy.
# The Supabase-backed tests (RLS, roster RPC) self-skip without DB env, so CI
# runs the pure engine/connector/crypto suites and never deploys broken code.
#
# Required repo secret: VERCEL_TOKEN. The org/project IDs are not secret.

name: Deploy to Vercel (production)

on:
  push:
    branches: [main]
    # Docs/markdown never affect the build — don't redeploy prod for them.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# Never run two production deploys at once; don't cancel one mid-flight.
concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_a3e9ATz9E72EJuYoc3Br1jUj
  VERCEL_PROJECT_ID: prj_VNbFyjpdIwOheYCoOiij3L8qLy7E

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install, not npm ci: the lockfile is generated on Windows, and
      # Tailwind v4's native oxide/lightningcss packages resolve different
      # @emnapi optional-dep versions on Linux — a cross-platform lockfile npm
      # ci won't accept. npm install reconciles the platform deps on the runner.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Source deploy (Vercel builds on its own infra), NOT --prebuilt: the
      # Supabase env vars are marked Sensitive in Vercel, which `vercel pull`
      # can't read back — a local prebuilt build would inline the
      # NEXT_PUBLIC_SUPABASE_* values as undefined and 500 at runtime. Building
      # on Vercel gives the build full access to those vars.
      - name: Deploy to production
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
