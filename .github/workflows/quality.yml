# The quality gate. One definition, two consumers: ci.yml (pull requests and
# feature branches) and deploy-prod.yml (push to main). Reusable rather than
# duplicated so the gate that guards a PR is byte-for-byte the gate that guards
# production — a copy-pasted gate drifts the moment someone relaxes one side.
#
# Dependency policy behind these steps: docs/architecture.md §10.

name: Quality gate

on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs, not tags: a tag is mutable, so `@v4`
      # means "whatever that tag points at today". Dependabot's github-actions
      # ecosystem keeps these SHAs current (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # npm ci, not npm install: installs exactly the reviewed tree and fails
      # if package-lock.json and package.json have drifted apart.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Audit first — it is the cheapest signal and the one most likely to be
      # the reason a build should stop. high/critical fail; moderate and low
      # are reported by the command's own output without failing. No accepted
      # exceptions today (the tree audits clean).
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The Supabase-backed tests (RLS, roster RPC) self-skip without DB env,
      # so this runs the pure engine/connector/crypto suites. Issue #78 removes
      # that self-skip and moves the isolation test to its own workflow.
      - name: Test
        run: npm test

      # Last, and load-bearing: lint, typecheck and vitest all pass on code
      # `next build` rejects. A "use server" module exporting one constant
      # broke production this way (PR #105) after a fully green gate — the
      # compiler drops every export in such a file, which no other step sees.
      # No env vars: every page here is dynamic, so the build needs no
      # Supabase credentials and this step stays secret-free.
      - name: Build
        run: npm run build
