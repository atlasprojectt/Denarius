# The quality gate. One definition, two consumers: ci.yml (pull requests and
# feature branches) and deploy-prod.yml (push to main). Reusable rather than
# duplicated so the gate that guards a PR is byte-for-byte the gate that guards
# production — a copy-pasted gate drifts the moment someone relaxes one side.
#
# The gate runs against a REAL database (issue #78): an ephemeral Supabase
# stack raised in the job, with every migration in supabase/migrations applied
# from scratch. Before that, the Supabase-backed suites — RLS isolation above
# all — self-skipped for want of env, so every push to main deployed having
# proven the engine arithmetic and nothing whatsoever about tenancy.
#
# Dependency policy behind these steps: docs/architecture.md §10.

name: Quality gate

on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs, not tags: a tag is mutable, so `@v4`
      # means "whatever that tag points at today". Dependabot's github-actions
      # ecosystem keeps these SHAs current (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # npm ci, not npm install: installs exactly the reviewed tree and fails
      # if package-lock.json and package.json have drifted apart.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Audit first — it is the cheapest signal and the one most likely to be
      # the reason a build should stop. high/critical fail; moderate and low
      # are reported by the command's own output without failing. No accepted
      # exceptions today (the tree audits clean).
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # A database for the job. `supabase start` applies supabase/migrations
      # from zero, in order, so a migration that no longer applies fails CI
      # rather than production — a check nothing performed before this.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.112.0

      - name: Start the ephemeral database (applies every migration from scratch)
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor

      # The local stack mints its own keys per run; they are read back from it
      # rather than written down, so no credential lives in this file. Nothing
      # here touches the production project — that is #63's separation, and the
      # reason this job can afford to be destructive.
      - name: Export the database env
        run: |
          eval "$(supabase status -o env)"
          # Fail here, loudly, rather than handing the tests empty credentials
          # and letting them report "no database" as if that were the finding.
          : "${API_URL:?supabase status reported no API_URL}"
          : "${ANON_KEY:?supabase status reported no ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status reported no SERVICE_ROLE_KEY}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # DENARIUS_REQUIRE_DB_TESTS turns a skipped database suite into a FAILING
      # one (tests/support/db.ts). A green check over an isolation test that
      # silently did not run is worse than no test at all, because the check
      # claims otherwise.
      - name: Test
        run: npm test
        env:
          DENARIUS_REQUIRE_DB_TESTS: "1"

      # Last, and load-bearing: lint, typecheck and vitest all pass on code
      # `next build` rejects. A "use server" module exporting one constant
      # broke production this way (PR #105) after a fully green gate — the
      # compiler drops every export in such a file, which no other step sees.
      # No env vars: every page here is dynamic, so the build needs no
      # Supabase credentials and this step stays secret-free.
      - name: Build
        run: npm run build
